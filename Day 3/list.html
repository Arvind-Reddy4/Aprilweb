<body>


      <!-- Order List 
      li - List of data  
      -->
    <ol Type = "a">              <!we can change into any type of list by changing the type attribute>
        <li> BMW </li>
        <li> BENTLY </li>
        <li> ROLLS ROYCE </li>
        <li> LEXUS </li>
         
    </ol>

       <!-- Unordered List -->
    <ul Type = "square">             <!we can change into any type of list by changing the type attribute>
         <li> NINJA </li>
        <li> JAVA </li>
        <li> TRIHUMP </li>
        <li> ENFIELD </li>
    </ul>

    
    




    
</body>
